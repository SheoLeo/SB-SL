<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Журнал Странствий — Dark Souls</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cormorant Garamond (Headers/UI) & PT Serif (Parchment Body Text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-light: #ffe299;
            --gold-dim: #9e824c;
            --ember-orange: #ff6a00;
            --ember-red: #b82900;
            --parchment-bg: #bfB8A8;
            --parchment-dark: #8c8372;
        }

        * {
            user-select: none;
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0d10;
            font-family: 'Cormorant Garamond', serif;
            color: #d8d4cb;
        }

        /* Atmospheric Background */
        .bg-scene {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 72%, rgba(255, 105, 20, 0.22) 0%, rgba(160, 45, 5, 0.08) 22%, transparent 50%),
                radial-gradient(circle at 38% 28%, rgba(68, 81, 94, 0.35) 0%, rgba(20, 25, 32, 0.85) 60%, #07080a 100%);
            z-index: 0;
        }

        /* Heavy Vignette & Mist Overlay */
        .vignette {
            position: absolute;
            inset: 0;
            box-shadow: inset 0 0 130px 45px rgba(0, 0, 0, 0.92);
            background: linear-gradient(180deg, rgba(5,7,9,0.55) 0%, transparent 25%, transparent 75%, rgba(5,7,9,0.85) 100%);
            pointer-events: none;
            z-index: 3;
        }

        /* Metallic Text Styling for "ЖУРНАЛ СТРАНСТВИЙ" */
        .journal-title {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            letter-spacing: 0.06em;
            background: linear-gradient(180deg, #e8e4dc 0%, #a9a296 55%, #6e685f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 3px 6px rgba(0, 0, 0, 0.9));
        }

        /* Active Quest Item Highlight matching reference */
        .quest-item {
            position: relative;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            border-top: 1px solid transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .quest-item:hover:not(.active) {
            background: linear-gradient(90deg, rgba(190, 155, 95, 0.08) 0%, transparent 85%);
            transform: translateX(4px);
        }

        .quest-item.active {
            background: linear-gradient(90deg, rgba(168, 128, 56, 0.32) 0%, rgba(110, 82, 34, 0.16) 55%, transparent 100%);
            border-top: 1px solid rgba(235, 195, 115, 0.45);
            border-bottom: 1px solid rgba(235, 195, 115, 0.45);
            box-shadow: inset 0 0 25px rgba(212, 160, 68, 0.12);
        }

        /* Glowing top & bottom flares on active quest */
        .quest-item.active::before,
        .quest-item.active::after {
            content: '';
            position: absolute;
            left: 0;
            width: 85%;
            height: 1px;
            background: linear-gradient(90deg, rgba(255, 223, 140, 0.9) 0%, rgba(214, 165, 75, 0.3) 60%, transparent 100%);
        }
        .quest-item.active::before { top: -1px; }
        .quest-item.active::after { bottom: -1px; }

        /* Left Vertical Timeline Line & Glowing Diamond Indicator */
        .timeline-track {
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, 
                rgba(195, 175, 135, 0.7) 0%, 
                rgba(140, 130, 115, 0.35) 70%, 
                rgba(90, 85, 75, 0.15) 100%);
        }

        .timeline-diamond {
            position: absolute;
            left: -6px;
            width: 14px;
            height: 14px;
            transition: top 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            filter: drop-shadow(0 0 8px rgba(255, 215, 110, 0.95)) drop-shadow(0 0 15px rgba(255, 160, 40, 0.8));
            z-index: 10;
        }

        /* Right Panel: Gothic Iron Frame & Aged Parchment */
        .iron-frame {
            position: relative;
            background: #1a1917;
            padding: 12px;
            border: 2px solid #3c3832;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.95),
                0 0 0 1px #0d0c0b,
                inset 0 0 12px rgba(0, 0, 0, 0.95);
            background-image: 
                repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 6px),
                linear-gradient(135deg, #2e2b27 0%, #171513 50%, #292623 100%);
        }

        .parchment-page {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #c2bba8;
            background-image: 
                radial-gradient(circle at 50% 45%, rgba(226, 220, 205, 0.7) 0%, rgba(182, 173, 154, 0.6) 65%, rgba(118, 108, 90, 0.88) 100%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.09'/%3E%3C/svg%3E");
            box-shadow: 
                inset 0 0 38px rgba(35, 28, 18, 0.78),
                inset 0 0 12px rgba(20, 15, 10, 0.9),
                0 0 2px rgba(0,0,0,0.8);
            border: 1px solid #595143;
            color: #1c1813;
            font-family: 'PT Serif', serif;
        }

        /* Distressed Stains on Parchment */
        .parchment-page::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 12% 18%, rgba(82, 68, 48, 0.18) 0%, transparent 28%),
                radial-gradient(circle at 88% 82%, rgba(72, 58, 40, 0.24) 0%, transparent 34%),
                radial-gradient(circle at 80% 12%, rgba(65, 52, 36, 0.2) 0%, transparent 25%);
            pointer-events: none;
        }

        /* Sketch Illustration Container with Soft Vignette Fade */
        .sketch-wrapper {
            position: relative;
            width: 100%;
            overflow: hidden;
            mask-image: radial-gradient(ellipse 92% 88% at 50% 48%, black 62%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 92% 88% at 50% 48%, black 62%, transparent 100%);
        }

        /* Custom Parchment Checkbox */
        .ds-checkbox {
            width: 18px;
            height: 18px;
            min-width: 18px;
            border: 1.5px solid #453d31;
            background: rgba(135, 124, 104, 0.35);
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.25);
            position: relative;
            transition: all 0.2s ease;
        }

        .objective-row:hover .ds-checkbox {
            border-color: #1f1912;
            background: rgba(115, 102, 82, 0.5);
        }

        /* Left Quest List To-Do Completion Checkbox */
        .quest-status-check {
            width: 24px;
            height: 24px;
            min-width: 24px;
            border: 1.5px solid rgba(158, 130, 76, 0.55);
            background: rgba(15, 14, 12, 0.75);
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.9);
            transition: all 0.25s ease;
            position: relative;
        }

        .quest-status-check:hover {
            border-color: #ffe299;
            box-shadow: 0 0 10px rgba(255, 185, 65, 0.45), inset 0 0 6px rgba(255, 185, 65, 0.2);
            transform: scale(1.08);
        }

        .quest-status-check.completed {
            border-color: #e6b85c;
            background: radial-gradient(circle, rgba(168, 115, 32, 0.55) 0%, rgba(45, 32, 12, 0.95) 100%);
            box-shadow: 0 0 12px rgba(255, 175, 45, 0.5);
        }

        /* Completed Quest Strikethrough & Ash Styling */
        .quest-item.quest-completed .quest-title-text {
            text-decoration: line-through;
            text-decoration-color: rgba(218, 175, 92, 0.75);
            text-decoration-thickness: 1.5px;
            color: #8c8578 !important;
        }

        .quest-item.quest-completed .quest-subtitle-text {
            color: #635e54 !important;
        }

        .quest-item.quest-completed .quest-icon-wrap {
            filter: grayscale(0.75) opacity(0.6);
        }

        /* Wax Seal Stamp on Parchment for Completed Quests */
        .wax-seal {
            position: absolute;
            top: 14px;
            right: 16px;
            z-index: 25;
            pointer-events: none;
            transform: rotate(-11deg) scale(1);
            animation: stampIn 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.55));
        }

        @keyframes stampIn {
            0% { transform: rotate(-22deg) scale(1.8); opacity: 0; }
            100% { transform: rotate(-11deg) scale(1); opacity: 1; }
        }

        /* Dark Souls "ЗАДАНИЕ ВЫПОЛНЕНО" Macro Banner Overlay */
        #dsBannerOverlay {
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.65s ease;
        }

        #dsBannerOverlay.show {
            opacity: 1;
        }

        .ds-banner-bar {
            background: linear-gradient(180deg, 
                transparent 0%, 
                rgba(5, 5, 5, 0.75) 20%, 
                rgba(8, 7, 6, 0.92) 50%, 
                rgba(5, 5, 5, 0.75) 80%, 
                transparent 100%);
            border-top: 1px solid rgba(195, 155, 75, 0.25);
            border-bottom: 1px solid rgba(195, 155, 75, 0.25);
        }

        .ds-banner-text {
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 0.22em;
            color: #f3d58d;
            text-shadow: 
                0 0 18px rgba(255, 175, 45, 0.85),
                0 0 38px rgba(215, 110, 15, 0.65),
                0 4px 10px rgba(0, 0, 0, 0.95);
            animation: bannerExpand 2.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes bannerExpand {
            0% { transform: scale(0.92); letter-spacing: 0.14em; opacity: 0; }
            25% { opacity: 1; }
            100% { transform: scale(1.03); letter-spacing: 0.26em; opacity: 1; }
        }

        /* Animations for Bonfire & Embers */
        @keyframes pulseFire {
            0%, 100% { transform: scale(1) translateY(0); opacity: 0.92; }
            25% { transform: scale(1.04, 0.97) translateY(1px); opacity: 1; }
            50% { transform: scale(0.97, 1.05) translateY(-2px); opacity: 0.86; }
            75% { transform: scale(1.03, 1.02) translateY(0px); opacity: 0.95; }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.55; transform: scale(1); }
            50% { opacity: 0.82; transform: scale(1.08); }
        }

        @keyframes runeFlicker {
            0%, 100% { filter: drop-shadow(0 0 6px #ff6a00) drop-shadow(0 0 12px #d43800); opacity: 0.95; }
            50% { filter: drop-shadow(0 0 3px #ff4800) drop-shadow(0 0 6px #9e2200); opacity: 0.68; }
        }

        .fire-anim {
            animation: pulseFire 2.7s infinite ease-in-out;
            transform-origin: center bottom;
        }

        .fire-glow-anim {
            animation: pulseGlow 3.2s infinite ease-in-out;
        }

        .rune-glow {
            animation: runeFlicker 3s infinite ease-in-out;
        }

        /* Fade transition for switching quests */
        .fade-transition {
            transition: opacity 0.28s ease, transform 0.28s ease;
        }
        .fade-out {
            opacity: 0;
            transform: translateY(5px);
        }

        /* Sleek Custom Dark-Gold Scrollbar for the 14-item Quest List & Parchment */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(12, 12, 14, 0.55);
            border-left: 1px solid rgba(255, 255, 255, 0.04);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #6e5a38 0%, #9e824c 50%, #59472b 100%);
            border-radius: 3px;
            border: 1px solid rgba(255, 226, 153, 0.25);
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #8c7346 0%, #c7a45e 50%, #735c38 100%);
        }
    </style>
</head>
<body class="relative select-none flex items-center justify-center">

    <!-- 1. BACKGROUND SCENE: Blurred Gothic Ruins + Glowing Bonfire in the Mist -->
    <div class="bg-scene overflow-hidden">
        <!-- Blurred Gothic Castle Ruin Silhouette & Ground (Matches center-middle reference) -->
        <svg class="w-full h-full object-cover" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
            <defs>
                <filter id="bgBlur" x="-10%" y="-10%" width="120%" height="120%">
                    <feGaussianBlur stdDeviation="10" />
                </filter>
                <filter id="heavyBlur" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="24" />
                </filter>
                <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#1c2229" />
                    <stop offset="55%" stop-color="#303942" />
                    <stop offset="100%" stop-color="#0d0e11" />
                </linearGradient>
                <radialGradient id="mistLight" cx="42%" cy="32%" r="45%">
                    <stop offset="0%" stop-color="#697785" stop-opacity="0.45" />
                    <stop offset="60%" stop-color="#2a323b" stop-opacity="0.2" />
                    <stop offset="100%" stop-color="#0c0e12" stop-opacity="0" />
                </radialGradient>
                <radialGradient id="bonfireGroundGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ff8826" stop-opacity="0.55" />
                    <stop offset="35%" stop-color="#cc4400" stop-opacity="0.25" />
                    <stop offset="100%" stop-color="#000000" stop-opacity="0" />
                </radialGradient>
            </defs>

            <!-- Sky & Mist -->
            <rect width="1920" height="1080" fill="url(#skyGrad)" />
            <rect width="1920" height="1080" fill="url(#mistLight)" />

            <!-- Distant Castle Ruins (Blurred like depth-of-field in reference) -->
            <g filter="url(#bgBlur)" opacity="0.88">
                <!-- Far Left Ruin Wall -->
                <path d="M150,1080 L150,480 L230,450 L310,490 L380,380 L430,380 L450,520 L650,550 L650,1080 Z" fill="#12161b" />
                
                <!-- Center-Left Iconic Gothic Cathedral / Keep -->
                <path d="M770,1080 L770,320 L785,320 L785,345 L805,345 L805,320 L825,320 L825,345 L845,345 L845,320 L865,320 L865,410 
                         L910,425 L945,350 L980,350 L995,435 L1035,440 
                         L1035,160 L1055,160 L1055,190 L1080,190 L1080,160 L1105,160 L1105,190 L1130,190 L1130,160 L1155,160 L1155,340
                         L1230,360 L1230,1080 Z" fill="#171c22" />
                
                <!-- Cathedral Highlights & Windows -->
                <rect x="1065" y="220" width="22" height="55" rx="11" fill="#2c3540" opacity="0.45" />
                <rect x="1105" y="220" width="22" height="55" rx="11" fill="#2c3540" opacity="0.45" />
                <rect x="805" y="380" width="25" height="65" rx="12" fill="#29323c" opacity="0.35" />

                <!-- Rocky Slopes & Ruined Arches -->
                <path d="M580,750 Q720,620 890,680 L1260,650 L1450,820 L1450,1080 L400,1080 Z" fill="#101317" />
            </g>

            <!-- Soft Drifting Fog Layers -->
            <g filter="url(#heavyBlur)" opacity="0.4">
                <ellipse cx="680" cy="540" rx="390" ry="90" fill="#46525e" />
                <ellipse cx="1050" cy="620" rx="340" ry="80" fill="#323b44" />
            </g>

            <!-- Foreground Dark Earth & Cracked Stones Around Bonfire -->
            <g filter="url(#bgBlur)">
                <ellipse cx="960" cy="960" rx="850" ry="260" fill="#0c0b0d" />
                <!-- Warm reflection on rocky ground -->
                <ellipse cx="950" cy="835" rx="330" ry="115" fill="url(#bonfireGroundGlow)" class="fire-glow-anim" />
                
                <!-- Scattered Stones & Ash Pile -->
                <ellipse cx="950" cy="825" rx="95" ry="28" fill="#1e1714" />
                <circle cx="910" cy="828" r="16" fill="#2b211b" />
                <circle cx="945" cy="834" r="20" fill="#261c17" />
                <circle cx="980" cy="829" r="15" fill="#30231b" />
                <ellipse cx="780" cy="885" rx="60" ry="14" fill="#181616" />
                <ellipse cx="830" cy="925" rx="85" ry="18" fill="#151314" />

                <!-- Coiled Bonfire Sword plunged into ash -->
                <g transform="translate(950, 745) rotate(8)">
                    <!-- Blade -->
                    <path d="M-4,80 L-2,-55 L0,-65 L2,-55 L4,80 Z" fill="#4a3b32" />
                    <!-- Twisted Guard -->
                    <path d="M-22,-52 Q0,-42 22,-52 Q12,-46 0,-46 Q-12,-46 -22,-52 Z" fill="#5c4738" stroke="#2a1e17" stroke-width="2" />
                    <!-- Hilt & Pommel -->
                    <rect x="-3" y="-85" width="6" height="32" fill="#3b2d24" />
                    <circle cx="0" cy="-89" r="6" fill="#594639" />
                </g>

                <!-- Glowing Bonfire Flames (Blurred background depth matching reference) -->
                <g class="fire-anim" transform="translate(950, 820)">
                    <!-- Outer Orange Flame -->
                    <path d="M-48,5 Q-60,-45 -22,-85 Q-5,-135 8,-155 Q22,-115 15,-85 Q48,-55 38,5 Z" fill="#ff5500" opacity="0.82" />
                    <!-- Mid Warm Amber Flame -->
                    <path d="M-32,8 Q-38,-35 -12,-72 Q4,-115 10,-125 Q18,-80 28,-35 Q30,5 0,10 Z" fill="#ff991f" opacity="0.9" />
                    <!-- Bright Core -->
                    <path d="M-18,6 Q-20,-28 -4,-58 Q6,-82 12,-45 Q18,-15 4,8 Z" fill="#fff0b8" />
                    <!-- Detached Floating Flame Licks -->
                    <circle cx="-18" cy="-110" r="8" fill="#ffae33" />
                    <circle cx="22" cy="-95" r="7" fill="#ff7714" />
                    <circle cx="2" cy="-145" r="6" fill="#ffbb44" />
                </g>
            </g>
        </svg>
    </div>

    <!-- Ambient Floating Ember Particles Canvas -->
    <canvas id="emberCanvas" class="absolute inset-0 pointer-events-none z-10"></canvas>

    <!-- Heavy Atmospheric Vignette -->
    <div class="vignette"></div>

    <!-- DARK SOULS "ЗАДАНИЕ ВЫПОЛНЕНО" BANNER OVERLAY -->
    <div id="dsBannerOverlay" class="fixed inset-0 z-50 flex items-center justify-center">
        <div class="ds-banner-bar w-full py-7 flex flex-col items-center justify-center relative">
            <div id="dsBannerTitle" class="ds-banner-text text-3xl sm:text-5xl md:text-6xl font-semibold uppercase text-center px-4">
                ЗАДАНИЕ ВЫПОЛНЕНО
            </div>
            <div id="dsBannerSub" class="text-[#b8ab93] text-xs sm:text-sm uppercase tracking-[0.35em] mt-1 opacity-80">
                QUEST COMPLETED
            </div>
        </div>
    </div>

            <!-- Ember sparks behind corner -->

            <circle cx="126" cy="34" r="22" fill="#121110" stroke="#59493a" stroke-width="1.5"/>
            <!-- Glowing Rune -->
            <g class="rune-glow">
                <path d="M118,30 L132,24 L125,44 M119,37 L135,35" fill="none" stroke="#ffaa44" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="135" cy="26" r="1.8" fill="#ffe099"/>

        </svg>
    </div>

    <!-- Bottom-Left Corner -->
    <div class="fixed bottom-2 left-2 w-28 h-28 md:w-36 md:h-36 pointer-events-none z-30">
        <svg viewBox="0 0 160 160" class="w-full h-full">
            <!-- Ember sparks -->
            <g class="rune-glow">
                <path d="M10,135 L14,45 M18,115 L8,70" stroke="#ff6a00" stroke-width="2.2" stroke-dasharray="4 7"/>
                <circle cx="12" cy="85" r="2.5" fill="#ffae42"/>
                <circle cx="16" cy="55" r="2" fill="#ff5500"/>
            </g>
            <!-- Dark Forged Iron Frame -->
            <path d="M4,5 L4,142 L18,156 L155,156 L132,146 L68,144 C52,128 32,108 16,92 L14,28 Z" fill="#161514" stroke="#47423b" stroke-width="1.5"/>
            <circle cx="34" cy="126" r="22" fill="#121110" stroke="#59493a" stroke-width="1.5"/>
            <!-- Glowing Rune -->
            <g class="rune-glow">
                <path d="M26,122 L35,116 L32,136 M26,130 L42,125" fill="none" stroke="#ff9d3b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="40" cy="118" r="1.8" fill="#ffd280"/>
            </g>
        </svg>

        const SoundFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            // Soft low resonant parchment switch sound
            playSelect() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(145, now);
                    osc.frequency.exponentialRampToValueAtTime(65, now + 0.22);

                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } catch (e) {}
            },
            // Metallic rune check sound
            playCheck(checked) {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(checked ? 320 : 210, now);
                    osc.frequency.exponentialRampToValueAtTime(checked ? 540 : 140, now + 0.18);

                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } catch (e) {}
            },
            // Dramatic Dark Souls "Quest Completed" Resonant Bell Chord
            playQuestComplete() {
                try {
                    this.init();
                    if (!this.ctx) return;
                    const now = this.ctx.currentTime;
                    const freqs = [110, 164.81, 220, 277.18, 329.63, 440];
                    freqs.forEach((f, idx) => {
                        const osc = this.ctx.createOscillator();
                        const gain = this.ctx.createGain();
                        osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
                        osc.frequency.setValueAtTime(f, now);
                        osc.frequency.exponentialRampToValueAtTime(f * 0.992, now + 2.2);

                        gain.gain.setValueAtTime(0.001, now);
                        gain.gain.linearRampToValueAtTime(0.065 / (idx * 0.4 + 1), now + 0.08);
                        gain.gain.exponentialRampToValueAtTime(0.0008, now + 2.3);

                        osc.connect(gain);
                        gain.connect(this.ctx.destination);
                        osc.start(now);
                        osc.stop(now + 2.35);
                    });
                } catch (e) {}
            }
        };

                lore: `Великий генерал Хазан был ложно обвинён в измене, подвергнут пыткам и изгнан в заснеженные горы. Заключив сделку с Призраком Клинка, первый берсерк возвращается за кровавой расплатой.`,
                objectives: [
                    { text: 'Выжить в снегах и пробудить силу Призрака Клинка', done: false },
                    { text: 'Сокрушить бывших соратников и чудовищ Империи', done: false },
                    { text: 'Свершить кровавую месть генерала Хазана', done: false }
                ]
            },
            {
                id: 'archthrones',
                titleRu: 'Dark Souls: Archthrones',
                titleEn: 'Пять престолов • Overhaul Mod',
                iconKey: 'crown',
                illustrationKey: 'lordsouls',
                completed: false,
                lore: `Масштабная фанатская предыстория вселенной Тёмных Душ. События разворачиваются вокруг пяти Архитронов, открывающих путь в переосмысленные земли Картуса, Элеум Лойс и Храма Глубин.`,
                objectives: [
                    { text: 'Установить мод и отправиться к Нексусу Углей', done: false },
                    { text: 'Исследовать все 5 миров Архитронов', done: false },
                    { text: 'Одолеть новых боссов и рыцарей серебряного легиона', done: false }
                ]
            },
            {
                id: 'valormortis',
                titleRu: 'Valor Mortis',
                titleEn: 'Пепел Наполеоновских войн • Resurrection & Plague',
                iconKey: 'cleaver',
                illustrationKey: 'napoleonic',
                completed: false,
                lore: `Мрачный альтернативный XIX век, где поля сражений Наполеоновских войн пропитаны сверхъестественной чумой. Восставшему из мёртвых солдату предстоит прорубать путь сквозь мутировавшую гвардию с саблей и мушкетом.`,
                objectives: [
                    { text: 'Восстать из братской могилы Великой Армии', done: false },
                    { text: 'Освоить бой от первого лица: мушкет, сабля и мутации', done: false },
                    { text: 'Раскрыть источник чумы на полях Европы', done: false }
                ]
            }
        ];

        const STORAGE_KEY = 'souls_backlog_journal_v1';
        let questsData = [];
        let activeQuestIndex = 0;
        let bannerTimeout = null;

        function loadQuestsState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        questsData = parsed;
                        return;
                    }
                }
            } catch (e) {}
            questsData = JSON.parse(JSON.stringify(defaultQuestsData));
        }

        function saveQuestsState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(questsData));
            } catch (e) {}
        }

        const questListContainer = document.getElementById('questListContainer');
        const timelineDiamond = document.getElementById('timelineDiamond');
        const parchmentContent = document.getElementById('parchmentContent');
        const questIllustration = document.getElementById('questIllustration');
        const questLore = document.getElementById('questLore');
        const questObjectives = document.getElementById('questObjectives');
        const parchmentSeal = document.getElementById('parchmentSeal');
        const toggleQuestCompleteBtn = document.getElementById('toggleQuestCompleteBtn');
        const questProgressCounter = document.getElementById('questProgressCounter');
        const dsBannerOverlay = document.getElementById('dsBannerOverlay');
        const dsBannerTitle = document.getElementById('dsBannerTitle');
        const dsBannerSub = document.getElementById('dsBannerSub');

        /* --- Show Dramatic Dark Souls Completion Banner --- */
        function triggerDarkSoulsBanner(titleText = 'ЗАДАНИЕ ВЫПОЛНЕНО', subText = 'QUEST COMPLETED') {
            if (bannerTimeout) clearTimeout(bannerTimeout);
            dsBannerTitle.textContent = titleText;
            dsBannerSub.textContent = subText;
            // Reset animation
            dsBannerTitle.style.animation = 'none';
            void dsBannerTitle.offsetWidth;
            dsBannerTitle.style.animation = '';

            dsBannerOverlay.classList.add('show');
            bannerTimeout = setTimeout(() => {
                dsBannerOverlay.classList.remove('show');
            }, 2200);
        }

        /* --- Toggle Entire Quest Completion (To-Do Style) --- */
        function toggleQuestCompletion(index, forceState = null) {
            const quest = questsData[index];
            if (!quest) return;

            const newState = forceState !== null ? forceState : !quest.completed;
            quest.completed = newState;

            // Sync all sub-objectives when toggling the whole quest
            if (quest.objectives && quest.objectives.length > 0) {
                quest.objectives.forEach(obj => {
                    obj.done = newState;
                });
            }

            if (newState) {
                SoundFX.playQuestComplete();
                triggerDarkSoulsBanner('ЗАДАНИЕ ВЫПОЛНЕНО', quest.titleEn.replace(/[«»]/g, ''));
            } else {
                SoundFX.playCheck(false);
            }

            saveQuestsState();
            renderQuestList();
            renderParchmentDetails();
        }

        /* --- Render Left Quest List --- */
        function renderQuestList() {
            questListContainer.innerHTML = '';

            // Update progress counter
            const completedCount = questsData.filter(q => q.completed).length;
            questProgressCounter.textContent = `${completedCount} / ${questsData.length} Выполнено`;

            questsData.forEach((quest, idx) => {
                const isActive = idx === activeQuestIndex;
                const isDone = Boolean(quest.completed);
                const doneTasks = quest.objectives ? quest.objectives.filter(o => o.done).length : 0;
                const totalTasks = quest.objectives ? quest.objectives.length : 0;

                const item = document.createElement('div');
                item.className = `quest-item cursor-pointer py-3 px-3.5 flex items-center justify-between gap-3 ${isActive ? 'active' : 'opacity-85 hover:opacity-100'} ${isDone ? 'quest-completed' : ''}`;
                item.dataset.index = idx;

                const iconSvg = QuestIcons[quest.iconKey] || QuestIcons.bonfire;

                item.innerHTML = `
                    <div class="flex items-center gap-3.5 min-w-0 flex-1">
                        <!-- Interactive To-Do Checkbox for Closing/Completing Quest Directly -->
                        <button 
                            type="button"
                            title="${isDone ? 'Вернуть квест в активные' : 'Закрыть квест (Выполнено)'}"
                            class="quest-status-check flex items-center justify-center rounded-[2px] ${isDone ? 'completed' : ''}"
                            data-check-index="${idx}">
                            ${isDone ? `
                                <svg viewBox="0 0 20 20" class="w-4 h-4 text-[#ffe39f] drop-shadow-[0_0_4px_rgba(255,190,60,0.9)]">
                                    <path d="M4,10.5 L8,14.5 L16,5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            ` : ''}
                        </button>

                        <div class="quest-icon-wrap flex-shrink-0 w-11 h-11 flex items-center justify-center transition">
                            ${iconSvg}
                        </div>

                        <div class="flex flex-col min-w-0">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="quest-title-text text-[19px] sm:text-[21px] leading-snug font-semibold tracking-wide truncate ${isActive ? 'text-[#f2ead9]' : 'text-[#ccc5b8]'}">
                                    ${quest.titleRu}
                                </span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="quest-subtitle-text text-[14px] sm:text-[15px] leading-tight truncate ${isActive ? 'text-[#c7bc9f]' : 'text-[#8e887d]'}">
                                    ${quest.titleEn}
                                </span>
                                <span class="text-xs px-1.5 py-0.2 rounded-sm border ${isDone ? 'border-[#8f6f32] bg-[#302410]/80 text-[#e8c67a]' : 'border-[#3d3830] bg-[#161513]/70 text-[#9c9384]'}">
                                    ${isDone ? 'ВЫПОЛНЕНО' : `${doneTasks}/${totalTasks}`}
                                </span>
                            </div>
                        </div>
                    </div>
                `;

                // Clicking the checkbox toggles completion without switching if already active, or switches & toggles
                const checkBtn = item.querySelector('[data-check-index]');
                checkBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    activeQuestIndex = idx;
                    toggleQuestCompletion(idx);
                });

                // Clicking the row selects the quest
                item.addEventListener('click', () => selectQuest(idx));
                questListContainer.appendChild(item);
            });

            // Position the glowing diamond indicator alongside the active quest item
            requestAnimationFrame(() => {
                const activeEl = questListContainer.children[activeQuestIndex];
                if (activeEl) {
                    const offsetTop = activeEl.offsetTop + (activeEl.offsetHeight / 2) - 7;
                    timelineDiamond.style.top = `${offsetTop}px`;
                }
            });
        }

        /* --- Render Right Parchment Details --- */
        function renderParchmentDetails() {
            const quest = questsData[activeQuestIndex];
            if (!quest) return;

            // Show/hide wax seal stamp
            if (quest.completed) {
                parchmentSeal.classList.remove('hidden');
            } else {
                parchmentSeal.classList.add('hidden');
            }

            // Update Complete/Reopen Button on Parchment
            if (quest.completed) {
                toggleQuestCompleteBtn.textContent = '↺ Вернуть в активные';
                toggleQuestCompleteBtn.className = 'px-3.5 py-1.5 text-xs sm:text-sm font-bold uppercase tracking-wider border border-[#594e3f] bg-[#9c917d]/50 hover:bg-[#8a7f6b]/70 text-[#2b241b] transition rounded-sm';
            } else {
                toggleQuestCompleteBtn.textContent = '✓ Завершить задание';
                toggleQuestCompleteBtn.className = 'px-3.5 py-1.5 text-xs sm:text-sm font-bold uppercase tracking-wider border border-[#382b1e] bg-[#2e2419] hover:bg-[#453524] text-[#f0dfb8] transition rounded-sm shadow-sm';
            }

            // Illustration & Lore
            questIllustration.innerHTML = InkIllustrations[quest.illustrationKey] || InkIllustrations.bells;
            questLore.textContent = quest.lore;

            // Objectives with interactive checkboxes & delete button for custom tasks
            questObjectives.innerHTML = '';
            quest.objectives.forEach((obj, objIdx) => {
                const row = document.createElement('div');
                row.className = 'objective-row flex items-start justify-between gap-2 cursor-pointer group py-0.5';
                row.innerHTML = `
                    <div class="flex items-start gap-3.5 flex-1">
                        <div class="ds-checkbox mt-1 flex items-center justify-center">
                            ${obj.done ? `
                                <svg viewBox="0 0 18 18" class="w-4 h-4 text-[#2b1f14]">
                                    <path d="M3,9 L7,13 L15,4" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            ` : ''}
                        </div>
                        <span class="text-[15px] sm:text-[16px] leading-[1.38] transition-colors ${obj.done ? 'line-through text-[#595043]' : 'text-[#1a1612] group-hover:text-black'}">
                            ${obj.text}
                        </span>
                    </div>
                    ${quest.objectives.length > 1 ? `
                        <button type="button" title="Удалить задачу" class="delete-obj-btn opacity-0 group-hover:opacity-75 hover:!opacity-100 text-[#5c261c] text-xs px-1.5 py-0.5 transition">
                            ✕
                        </button>
                    ` : ''}
                `;

                // Toggle individual sub-objective and auto-update quest completion status
                row.addEventListener('click', (e) => {
                    if (e.target.closest('.delete-obj-btn')) return;
                    obj.done = !obj.done;

                    const allDone = quest.objectives.length > 0 && quest.objectives.every(o => o.done);
                    const wasCompleted = quest.completed;
                    quest.completed = allDone;

                    if (allDone && !wasCompleted) {
                        SoundFX.playQuestComplete();
                        triggerDarkSoulsBanner('ЗАДАНИЕ ВЫПОЛНЕНО', quest.titleEn.replace(/[«»]/g, ''));
                    } else {
                        SoundFX.playCheck(obj.done);
                    }

                    saveQuestsState();
                    renderQuestList();
                    renderParchmentDetails();
                });

                const delBtn = row.querySelector('.delete-obj-btn');
                if (delBtn) {
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        quest.objectives.splice(objIdx, 1);
                        quest.completed = quest.objectives.length > 0 && quest.objectives.every(o => o.done);
                        SoundFX.playSelect();
                        saveQuestsState();
                        renderQuestList();
                        renderParchmentDetails();
                    });
                }

                questObjectives.appendChild(row);
            });
        }

        /* --- Switch Active Quest with Smooth Fade --- */
        function selectQuest(index) {
            if (index === activeQuestIndex) return;
            activeQuestIndex = index;
            SoundFX.playSelect();
            renderQuestList();

            parchmentContent.classList.add('fade-out');
            setTimeout(() => {
                renderParchmentDetails();
                parchmentContent.classList.remove('fade-out');
            }, 180);
        }

        /* --- Floating Bonfire & Corner Ember Particles Canvas --- */
        function initEmberParticles() {
            const canvas = document.getElementById('emberCanvas');
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                renderQuestList();
            });

            const embers = [];
            const EMBER_COUNT = 55;

            function createEmber(initial = false) {
                // Spawn mostly near bottom-center bonfire or corners
                const spawnType = Math.random();
                let x, y;
                if (spawnType < 0.72) {
                    // Bonfire area (center bottom)
                    x = width * 0.5 + (Math.random() - 0.5) * 260;
                    y = initial ? height * (0.45 + Math.random() * 0.55) : height * 0.85 + Math.random() * 60;
                } else {
                    // Near the 4 rune corners
                    const leftSide = Math.random() < 0.5;
                    x = leftSide ? Math.random() * 140 : width - Math.random() * 140;
                    y = initial ? Math.random() * height : height - Math.random() * 150;
                }

                return {
                    x,
                    y,
                    vx: (Math.random() - 0.45) * 0.65,
                    vy: -(0.35 + Math.random() * 1.15),
                    size: 1 + Math.random() * 2.4,
                    alpha: 0.2 + Math.random() * 0.75,
                    wobble: Math.random() * Math.PI * 2,
                    wobbleSpeed: 0.02 + Math.random() * 0.04,
                    color: Math.random() > 0.35 ? '#ff7b1a' : '#ffcf66'
                };
            }

            for (let i = 0; i < EMBER_COUNT; i++) {
                embers.push(createEmber(true));
            }

            function animateEmbers() {
                ctx.clearRect(0, 0, width, height);

                for (let i = 0; i < embers.length; i++) {
                    const p = embers[i];
                    p.wobble += p.wobbleSpeed;
                    p.x += p.vx + Math.sin(p.wobble) * 0.3;
                    p.y += p.vy;
                    p.alpha -= 0.0022;

                    if (p.alpha <= 0 || p.y < -20) {
                        embers[i] = createEmber(false);
                        continue;
                    }

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = '#ff5500';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                requestAnimationFrame(animateEmbers);
            }

            animateEmbers();
        }

        /* --- Setup Interactive Forms & Buttons --- */
        function initFormsAndActions() {
            // Complete/Reopen button on the right parchment card
            toggleQuestCompleteBtn.addEventListener('click', () => {
                toggleQuestCompletion(activeQuestIndex);
            });

            // Add new sub-objective to current quest
            const addObjectiveForm = document.getElementById('addObjectiveForm');
            const newObjectiveInput = document.getElementById('newObjectiveInput');
            addObjectiveForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const val = newObjectiveInput.value.trim();
                if (!val) return;
                const quest = questsData[activeQuestIndex];
                if (!quest) return;

                quest.objectives.push({ text: val, done: false });
                quest.completed = false;
                newObjectiveInput.value = '';
                SoundFX.playCheck(true);
                saveQuestsState();
                renderQuestList();
                renderParchmentDetails();
            });

            // Add new custom quest to the journal list
            const addQuestForm = document.getElementById('addQuestForm');
            const newQuestInput = document.getElementById('newQuestInput');
            addQuestForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const val = newQuestInput.value.trim();
                if (!val) return;

                const icons = ['bell', 'bonfire', 'vessel', 'trophy'];
                const illustrations = ['bells', 'oscar', 'lordvessel', 'lordsouls'];
                const pickIdx = questsData.length % 4;

                const newQuest = {
                    id: 'custom_' + Date.now(),
                    titleRu: `«${val}»`,
                    titleEn: '«Path of the Chosen Undead»',
                    iconKey: icons[pickIdx],
                    illustrationKey: illustrations[pickIdx],
                    completed: false,
                    lore: `Запись, оставленная у пламени костра: странствие продолжается сквозь пепел и туман Лордрана. Чтобы не утратить рассудок и не обратиться в Полого, Избранный Нежить начертал эту цель на ветхом пергаменте.`,
                    objectives: [
                        { text: val, done: false }
                    ]
                };

                questsData.push(newQuest);
                activeQuestIndex = questsData.length - 1;
                newQuestInput.value = '';
                SoundFX.playSelect();
                saveQuestsState();
                renderQuestList();
                renderParchmentDetails();
            });

            // Reset Journal back to canonical Dark Souls state
            document.getElementById('resetJournalBtn').addEventListener('click', () => {
                questsData = JSON.parse(JSON.stringify(defaultQuestsData));
                activeQuestIndex = 0;
                SoundFX.playSelect();
                saveQuestsState();
                renderQuestList();
                renderParchmentDetails();
            });
        }

        /* --- Initialize App on Load --- */
        window.onload = function () {
            loadQuestsState();
            renderQuestList();
            renderParchmentDetails();
            initFormsAndActions();
            initEmberParticles();
        };
    </script>
</body>
</html>
